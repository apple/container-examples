# Postgres for the app, in its namespace: kubectl apply -k config/postgres
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-controller
resources:
- ../namespace
- deployment.yaml
- service.yaml
# An example password; kustomize appends a content hash to the Secret's name and rewrites
# every reference to it.
secretGenerator:
- name: postgres
  literals:
  - POSTGRES_PASSWORD=sample-app-demo

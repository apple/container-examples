# Allow the app's pods, and only them, to reach Postgres on 5432. Policies add up, so with
# deny-db in place the app gets through and nothing else does.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db
  namespace: sample-controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: sample-app
    ports:
    - protocol: TCP
      port: 5432
